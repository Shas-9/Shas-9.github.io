name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The "Download CV" button serves resume/Sharzil_Hasnine_Resume.pdf,
      # compiled fresh from LaTeX on every deploy.
      - name: Build resume PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Sharzil_Hasnine_Resume.tex
          working_directory: resume

      - name: Add resume PDF to the site
        run: cp resume/Sharzil_Hasnine_Resume.pdf public/Sharzil_Hasnine_Resume.pdf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Fails the build (instead of deploying a broken site) if
      # resume/master_resume.tex cannot be parsed.
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
